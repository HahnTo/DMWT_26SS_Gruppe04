services:
  db:
    image: postgres:16
    container_name: dmwt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dmwt
      POSTGRES_PASSWORD: dmwtpassword
      POSTGRES_DB: dmwt_comments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmwt -d dmwt_comments"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: dmwt_nextjs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://dmwt:dmwtpassword@db:5432/dmwt_comments"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data: